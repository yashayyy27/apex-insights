name: Data and source contracts
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python python/run_all.py
      - run: pytest -q tests
      - run: python python/audit_repository.py
      # This workflow does not execute Power BI Desktop or certify native Excel.
